[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis: a personal desktop agent. One model-driven loop, real tools, durable memory."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "openai>=1.50",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "platformdirs>=4.3",
    "rich>=13.9",
    "prompt-toolkit>=3.0.48",
    "psutil>=6.1",
    "beautifulsoup4>=4.12",
    "ddgs>=9.0",
    "send2trash>=1.8",
    "pyperclip>=1.9",
]

[project.optional-dependencies]
# Heavier capability packs, installed with: uv sync --extra office --extra screen
office = ["openpyxl>=3.1", "pypdf>=5.0", "markdown>=3.7", "xhtml2pdf>=0.2.16"]
screen = ["mss>=10.0", "pillow>=11.0", "rapidocr-onnxruntime>=1.4"]
browser = ["websockets>=15"]
voice = [
    "numpy>=2.1",
    "sounddevice>=0.5",
    "faster-whisper>=1.1",
    "piper-tts>=1.3",
    "onnxruntime>=1.20",
    "nvidia-cublas-cu12>=12.4,<12.9.3",
    "nvidia-cudnn-cu12>=9.1",
]
windows = ["pycaw>=20240210", "comtypes>=1.4", "pywinauto>=0.6.8", "pygetwindow>=0.0.9"]

[project.scripts]
jarvis = "jarvis.interfaces.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
