[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis: a personal desktop agent. One model-driven loop, real tools, durable memory."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "openai>=1.50",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "platformdirs>=4.3",
    "rich>=13.9",
    "prompt-toolkit>=3.0.48",
    "psutil>=6.1",
    "beautifulsoup4>=4.12",
    "ddgs>=9.0",
    "send2trash>=1.8",
    "pyperclip>=1.9",
    # Time-zone rules for scheduled tasks and calendar events; Windows has no system copy.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Heavier capability packs, installed with: uv sync --extra office --extra screen
office = [
    "openpyxl>=3.1",
    "pypdf>=5.0",
    "markdown>=3.7",
    "xhtml2pdf>=0.2.16",
    "python-docx>=1.2.0",
    # The Excel COM recalculation path (Windows only; elsewhere LibreOffice is used if present).
    "pywin32>=306; sys_platform == 'win32'",
]
screen = ["mss>=10.0", "pillow>=11.0", "rapidocr-onnxruntime>=1.4"]
browser = ["websockets>=15"]
voice = [
    "numpy>=2.1",
    "sounddevice>=0.5",
    "faster-whisper>=1.1",
    "piper-tts>=1.3",
    "onnxruntime>=1.20",
    # Online speech (free services; Piper and faster-whisper stay as the offline fallback).
    "av>=14",  # decodes the streamed MP3 (also a faster-whisper dependency)
    "edge-tts>=7.0",  # Microsoft Edge neural voices, unofficial client, no key
    "nvidia-riva-client>=2.17",  # NVIDIA hosted Magpie TTS / Parakeet ASR over gRPC
]
hud = ["PyQt6>=6.7", "qasync>=0.27"]
# CUDA libraries for GPU speech recognition. Not part of `all`: large, NVIDIA-only.
gpu = [
    "nvidia-cublas-cu12>=12.4,<12.9.3; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    "nvidia-cudnn-cu12>=9.1; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
]
# Everything except the GPU libraries.
all = ["jarvis[office,screen,browser,voice,hud]"]

[project.scripts]
jarvis = "jarvis.interfaces.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

# The Chrome extension ships inside the wheel so an installed copy can offer it for
# "Load unpacked" (jarvis/browser/bridge.py extension_dir() finds either location).
[tool.hatch.build.targets.wheel.force-include]
"extensions/jarvis-browser-control" = "jarvis/browser/extension"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["slow: loads real models; runs only with JARVIS_SLOW_TESTS=1"]
